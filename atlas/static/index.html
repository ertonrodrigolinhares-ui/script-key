<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230f4c5c'/%3E%3Ctext x='16' y='22' font-size='17' text-anchor='middle' fill='white' font-family='sans-serif'%3EA%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --fundo: #f6f5f2; --painel: #ffffff; --texto: #1d1d1b; --suave: #6b6a66;
    --borda: #e3e1dc; --destaque: #0f4c5c; --destaque-texto: #ffffff;
    --eu: #e8eef0; --erro: #a12a2a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #141413; --painel: #1e1e1c; --texto: #ecebe7; --suave: #a3a19b;
      --borda: #33322f; --destaque: #5fb0c2; --destaque-texto: #0b1f24;
      --eu: #23302f; --erro: #ef8a8a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fundo); color: var(--texto);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    height: 100dvh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    border-bottom: 1px solid var(--borda); background: var(--painel);
  }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .04em; }
  header span { color: var(--suave); font-size: 14px; flex: 1; }
  button {
    font: inherit; border: 1px solid var(--borda); background: var(--painel);
    color: var(--texto); border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  header button { white-space: nowrap; }
  header span { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  button.principal { background: var(--destaque); color: var(--destaque-texto); border-color: var(--destaque); }
  button:disabled { opacity: .5; cursor: default; }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  .trilho { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .msg { padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.eu { background: var(--eu); align-self: flex-end; max-width: 85%; }
  .msg.atlas { background: var(--painel); border: 1px solid var(--borda); }
  .msg.atlas strong { font-weight: 650; }
  .status { color: var(--suave); font-size: 14px; font-style: italic; }
  .erro { color: var(--erro); }
  .boas-vindas { color: var(--suave); text-align: center; margin-top: 12vh; }
  .boas-vindas h2 { color: var(--texto); font-size: 24px; margin-bottom: 4px; }
  form {
    display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--borda);
    background: var(--painel);
  }
  form .trilho { flex-direction: row; width: 100%; gap: 8px; }
  textarea {
    flex: 1; resize: none; font: inherit; color: var(--texto); background: var(--fundo);
    border: 1px solid var(--borda); border-radius: 10px; padding: 10px 12px; max-height: 40vh;
  }
  dialog {
    border: 1px solid var(--borda); border-radius: 12px; background: var(--painel);
    color: var(--texto); width: min(520px, calc(100vw - 32px)); padding: 20px;
  }
  dialog input {
    width: 100%; font: inherit; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--borda); background: var(--fundo); color: var(--texto);
  }
  dialog ul { padding-left: 18px; max-height: 30vh; overflow-y: auto; }
  dialog li { margin-bottom: 4px; }
  .linha { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  a { color: var(--destaque); }
</style>
</head>
<body>
<header>
  <h1>ATLAS</h1>
  <span>assistente de IA</span>
  <button id="nova" type="button">Nova conversa</button>
  <button id="abrir-config" type="button">⚙ Configurar</button>
</header>

<main id="rolagem">
  <div class="trilho" id="mensagens">
    <div class="boas-vindas" id="boas-vindas">
      <h2>Olá!</h2>
      <p>Pergunte, peça um texto, uma análise ou uma pesquisa.<br>
      Para eu guardar algo, diga: “Atlas, lembre que…”.</p>
    </div>
  </div>
</main>

<form id="form">
  <div class="trilho">
    <textarea id="entrada" rows="1" placeholder="Escreva sua mensagem…" title="Enter envia, Shift+Enter quebra linha"></textarea>
    <button class="principal" id="enviar" type="submit">Enviar</button>
  </div>
</form>

<dialog id="config">
  <h3 style="margin-top:0">Configuração</h3>
  <p>Chave da Anthropic (começa com <code>sk-ant-</code>).
    Crie em <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>.</p>
  <input id="chave" type="password" placeholder="sk-ant-..." autocomplete="off">
  <p id="chave-aviso" class="status"></p>
  <h4>O que eu lembro</h4>
  <ul id="lista-memoria"></ul>
  <p class="status">Chave e memória ficam em: <code id="pasta"></code></p>
  <h4>Definição da IA</h4>
  <p class="status" id="ia-resumo"></p>
  <div class="linha">
    <button type="button" id="fechar-config">Fechar</button>
    <button type="button" class="principal" id="salvar-chave">Salvar chave</button>
  </div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
let conversaId = null;
let ocupado = false;

function rolarFim() { $("rolagem").scrollTop = $("rolagem").scrollHeight; }

function escapar(t) {
  return t.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Markdown mínimo e seguro: escapa tudo antes de aplicar negrito, itálico e código.
function formatar(t) {
  return escapar(t)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/^#{1,6} (.+)$/gm, "<strong>$1</strong>");
}

function novaLinha(classe, texto) {
  const div = document.createElement("div");
  div.className = classe;
  div.textContent = texto;
  return div;
}

function adicionar(classe, texto) {
  $("boas-vindas")?.remove();
  const div = novaLinha(classe, texto);
  $("mensagens").appendChild(div);
  rolarFim();
  return div;
}

async function enviar(texto) {
  ocupado = true;
  $("enviar").disabled = true;
  const minha = adicionar("msg eu", texto);
  const caixa = adicionar("msg atlas", "");
  const status = adicionar("status", "Pensando…");
  let resposta = "";

  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ conversa: conversaId, texto }),
    });
    if (!r.ok) throw new Error("O servidor do Atlas respondeu com erro " + r.status);
    const leitor = r.body.getReader();
    const dec = new TextDecoder();
    let sobra = "";
    while (true) {
      const { value, done } = await leitor.read();
      if (done) break;
      sobra += dec.decode(value, { stream: true });
      const partes = sobra.split("\n\n");
      sobra = partes.pop();
      for (const parte of partes) {
        if (!parte.startsWith("data: ")) continue;
        const ev = JSON.parse(parte.slice(6));
        if (ev.tipo === "conversa") {
          if (ev.reiniciada) $("mensagens").insertBefore(novaLinha("status", "O Atlas foi reiniciado e não lembra da conversa acima; a mensagem abaixo começou uma conversa nova."), minha);
          conversaId = ev.id;
        } else if (ev.tipo === "texto") {
          resposta += ev.texto;
          caixa.innerHTML = formatar(resposta);
          status.textContent = "";
        } else if (ev.tipo === "descartar" && resposta.endsWith(ev.texto)) {
          resposta = resposta.slice(0, -ev.texto.length);
          caixa.innerHTML = formatar(resposta);
        } else if (ev.tipo === "memoria") $("mensagens").insertBefore(novaLinha("status", "🧠 " + ev.texto), status);
        else if (ev.tipo === "status") status.textContent = ev.texto;
        else if (ev.tipo === "erro") { status.textContent = ev.texto; status.classList.add("erro"); }
        rolarFim();
      }
    }
  } catch (e) {
    status.textContent = "Não consegui falar com o Atlas: " + e.message;
    status.classList.add("erro");
  }
  if (!resposta) caixa.remove();
  // Avisos passageiros somem no fim; avisos finais (resposta cortada, erros) ficam.
  if (["", "Pensando…", "Pesquisando na web..."].includes(status.textContent)) status.remove();
  ocupado = false;
  $("enviar").disabled = false;
  $("entrada").focus();
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const texto = $("entrada").value.trim();
  if (!texto || ocupado) return;
  $("entrada").value = "";
  $("entrada").style.height = "";
  enviar(texto);
});

$("entrada").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
});
$("entrada").addEventListener("input", (e) => {
  e.target.style.height = "auto";
  e.target.style.height = e.target.scrollHeight + "px";
});

$("nova").addEventListener("click", () => {
  if (ocupado) return;
  conversaId = null;
  $("mensagens").innerHTML = "";
  adicionar("status", "Nova conversa iniciada.");
});

async function abrirConfig() {
  const r = await fetch("/api/estado");
  const estado = await r.json();
  $("chave-aviso").textContent = estado.tem_chave ? "Chave já configurada. Cole outra só se quiser trocar." : "Nenhuma chave configurada ainda.";
  $("pasta").textContent = estado.pasta;
  const ia = estado.ia;
  $("ia-resumo").textContent =
    `Pasta: ${ia.pasta} · Documentos na base: ${ia.documentos}` +
    (ia.documentos_fora.length ? ` (${ia.documentos_fora.length} grandes demais, ignorados)` : "") +
    ` · Pesquisa na web: ${ia.fontes.length ? ia.fontes.join(", ") : "qualquer site"}`;
  const lista = $("lista-memoria");
  lista.innerHTML = "";
  if (!estado.memoria.length) lista.innerHTML = "<li class='status'>Nada guardado ainda.</li>";
  for (const item of estado.memoria) {
    const li = document.createElement("li");
    li.textContent = item.fato + " ";
    const apagar = document.createElement("button");
    apagar.textContent = "apagar";
    apagar.type = "button";
    apagar.onclick = async () => {
      await fetch("/api/memoria?exato=true&trecho=" + encodeURIComponent(item.fato), { method: "DELETE" });
      abrirConfig();
    };
    li.appendChild(apagar);
    lista.appendChild(li);
  }
  if (!$("config").open) $("config").showModal();
}

$("abrir-config").addEventListener("click", abrirConfig);
$("fechar-config").addEventListener("click", () => $("config").close());
$("salvar-chave").addEventListener("click", async () => {
  const chave = $("chave").value.trim();
  if (!chave) return;
  const r = await fetch("/api/chave", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ chave }),
  });
  if (r.ok) { $("chave").value = ""; $("chave-aviso").textContent = "Chave salva. Pode conversar."; }
  else { const d = await r.json(); $("chave-aviso").textContent = d.detail || "Chave inválida."; }
});

fetch("/api/estado").then((r) => r.json()).then((e) => { if (!e.tem_chave) abrirConfig(); });
</script>
</body>
</html>
